[package]
rust-version = "1.97.1"
name = "emblem"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/emblem"
description = "A complete pure-Rust implementation of IconVG, a compact binary format for simple vector graphics: icons, logos, glyphs and emoji. Decodes bytecode into path segments and fills for any 2D backend, and encodes graphics back to bytes deterministically. No rasterizer. Zero dependencies, unsafe-free, no-std-oriented."
keywords = ["iconvg", "vector", "graphics", "icons", "encoder"]
categories = ["encoding", "graphics", "no-std"]
readme = "README.md"

