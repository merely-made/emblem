[package]
rust-version = "1.97.1"
name = "emblem"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/emblem"
description = "A complete pure-Rust implementation of IconVG, a compact binary format for simple vector graphics: icons, logos, glyphs and emoji. Decodes bytecode into path segments and fills for any 2D backend, and encodes graphics back to bytes deterministically. No rasterizer. Zero dependencies, unsafe-free, no-std-oriented."
keywords = ["iconvg", "vector", "graphics", "icons", "encoder"]
categories = ["encoding", "graphics", "no-std"]
readme = "README.md"

[features]
# SVG text output (`emblem::svg`). No dependencies.
svg = []

[dependencies]

[dev-dependencies]

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

# The faces crate joined from Mere (iconography D1, engine split P3 slice 4).
# emblem stays the root package; pictograph is the second member.
[workspace]
resolver = "2"
members = [".", "crates/pictograph"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/emblem"

[workspace.dependencies]
emblem = { path = "." }
genet-livery = { version = "0.0.4", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
netrender = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender_vello = { package = "netrender-vello", version = "0.11.0", git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos", default-features = false }
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
# pictograph's dev dependency shares the renderer's device source (as in Mere).
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }
netrender-vello-encoding = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }
netrender-vello-shaders = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }
