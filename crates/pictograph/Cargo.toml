[package]
rust-version = "1.97.1"
name = "pictograph"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives compact IconVG node faces deterministically from content addresses, with palette-backed theming and built-in level of detail. Its optional vello feature decodes IconVG into the exact scene type consumed by netrender."
readme = "README.md"
keywords = ["identicon", "icon", "procedural", "vector", "iconvg"]
categories = ["graphics", "visualization"]

[[bin]]
name = "pack"
required-features = ["pack"]

[features]
pack = [
    "paint-list",
    "dep:netrender",
    "netrender/vello-cpu",
    "dep:paint_list_render",
    "dep:png",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
]
default = []
vello = ["dep:netrender_vello"]
# IconVG lowered to paint-list primitives (`pictograph::flat_icon`): the icon
# pack's rasterizer input and the canvas's face and wash painter.
paint-list = ["dep:paint_list_api"]
# The radial gradients a content wash carries (`flat_icon::wash_commands`).
# Only the canvas draws washes, so the pack leaves it off.
wash = ["paint-list"]
# Authored symbols as genet-livery vector images (`symbols::SymbolImage`).
livery = ["paint-list", "dep:genet-livery"]

[dependencies]
emblem.workspace = true
netrender_vello = { workspace = true, optional = true }
genet-livery = { workspace = true, optional = true }
netrender = { workspace = true, optional = true }
paint_list_api = { workspace = true, optional = true }
paint_list_render = { workspace = true, optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
serde_json = "1"
netrender_vello = { workspace = true, features = ["wgpu"] }
netrender_device = "=0.1.2"

[lints]
workspace = true
