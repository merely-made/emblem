[package]
name = "pictograph"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Name reservation. Pictograph derives node faces for the Mere platform: a deterministic generator from a content address to a compact vector face (IconVG bytes via emblem), palette-indexed so one blob re-themes at decode time, with level-of-detail carried inside the face. Picture-writing in both senses: a pictorial sign carrying meaning by convention, and data encoded as a picture."
readme = "README.md"
keywords = ["identicon", "icon", "procedural", "vector", "iconvg"]
categories = ["graphics", "visualization"]

