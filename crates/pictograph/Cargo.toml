[package]
rust-version = "1.97.1"
name = "pictograph"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives compact IconVG node faces deterministically from content addresses, with palette-backed theming and built-in level of detail. Its optional vello feature decodes IconVG into the exact scene type consumed by netrender."
readme = "README.md"
keywords = ["identicon", "icon", "procedural", "vector", "iconvg"]
categories = ["graphics", "visualization"]

[[example]]
name = "backdrop_receipt"
required-features = ["backdrop-cpu"]

[[example]]
name = "occurrence_replay"
required-features = ["canvas"]

[[example]]
name = "occurrence_replay_wasm"
crate-type = ["cdylib"]
required-features = ["canvas"]

[[example]]
name = "grouped_replay"
required-features = ["canvas"]

[[example]]
name = "grouped_replay_wasm"
crate-type = ["cdylib"]
required-features = ["canvas"]

[[example]]
name = "schedule_replay"
required-features = ["canvas"]

[[example]]
name = "schedule_replay_wasm"
crate-type = ["cdylib"]
required-features = ["canvas"]

[features]
backdrop-cpu = ["canvas", "netrender/vello-cpu"]
default = ["image-decode"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["genet-livery?/image-decode"]
vello = ["dep:netrender_vello"]
# Graph-structural signals over the kernel graph (`pictograph::signals`).
signals = ["dep:kernel", "dep:cartography", "dep:chartulary", "dep:libm"]
# The canvas's and the board's repulsion staged on the host's GPU
# (`Canvas::set_physics_device`; physics catalog plan, P5c). Opt-in per consumer.
gpu = ["canvas", "seiche/gpu"]
# The Meaning channel's sentence model on the host's own device
# (`canvas::meaning_device`; dynamics grammar plan, G2, "Burn on the host
# device, off-path"). Native hosts only: the wasm web build leaves it off and
# takes the lexical fallback.
meaning-gpu = ["gpu", "esp/bert-wgpu", "esp/index-burn-wgpu"]
# The graph canvas (`pictograph::canvas`): graph truth presented through
# seiche physics, the camera, the node-children pool and the scene-paint
# underlay. Mere's facade exposes it as `mere::canvas`.
canvas = [
    "signals",
    "dep:armillary",
    "dep:cartography",
    # Permitted actions are chirograph's `AdvertisedAction`s (stack seams S3;
    # dynamics grammar plan, G9).
    "dep:chirograph",
    # The native fold record (mer3ly site plan, Rulings 153 and 163).
    "dep:curation",
    "dep:esp",
    "dep:euclid",
    "dep:forme",
    "dep:genet-livery",
    "dep:genet-scripted-dom",
    "dep:kernel",
    "dep:layout_dom_api",
    "dep:netrender",
    "dep:numen",
    # The saved scene's shapes and the cartography geometry (pandect).
    "dep:pandect",
    "dep:paint_list_api",
    "dep:paint_list_render",
    "dep:petgraph",
    "dep:sceno",
    "dep:scenomise",
    "dep:scenograph",
    # The arrangement transitions `canvas::physics_controls` schedules
    # (Graphshell stack lift plan, P2 and L5).
    "dep:scenotime",
    "dep:seiche",
    # The dynamics spec's wire (dynamics grammar plan, G4a).
    "seiche/serde",
    "dep:serde",
    "dep:serde_json",
    "dep:tincture",
    "dep:tracing",
    "dep:uuid",
]

[dependencies]
emblem.workspace = true
netrender_vello = { workspace = true, optional = true }
armillary = { workspace = true, optional = true }
cartography = { workspace = true, optional = true }
chirograph = { workspace = true, optional = true }
curation = { workspace = true, optional = true }
chartulary = { workspace = true, optional = true }
esp = { workspace = true, optional = true }
euclid = { version = "0.22", optional = true }
forme = { workspace = true, optional = true }
genet-livery = { workspace = true, optional = true }
genet-scripted-dom = { workspace = true, optional = true }
kernel = { workspace = true, optional = true }
layout_dom_api = { workspace = true, optional = true }
# The spectral producer's start vector (`signals`): the same bits on every
# target, as scenomise's solvers (ruling S4).
libm = { workspace = true, optional = true }
netrender = { workspace = true, optional = true }
numen = { workspace = true, optional = true }
pandect = { workspace = true, optional = true }
paint_list_api = { workspace = true, optional = true }
paint_list_render = { workspace = true, optional = true }
petgraph = { version = "0.8.3", optional = true }
sceno = { workspace = true, optional = true }
scenomise = { workspace = true, optional = true }
scenograph = { workspace = true, optional = true }
scenotime = { workspace = true, optional = true }
seiche = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tincture = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
state-witness = { path = "../../system/state-witness" }
serde = { version = "1", features = ["derive"] }
kernel = { workspace = true, features = ["fixtures"] }
netrender_vello = { workspace = true, features = ["wgpu"] }
netrender_device = "=0.1.2"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen = "=0.2.129"
