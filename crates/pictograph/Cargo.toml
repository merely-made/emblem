[package]
name = "pictograph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives node faces from content addresses: a deterministic generator from an address to a compact vector face (IconVG bytes via emblem), palette-indexed so one blob re-themes at decode time against any palette, with level-of-detail carried inside the face so it simplifies itself when drawn small. Picture-writing in both senses: a pictorial sign carrying meaning by convention, and data encoded as a picture."
readme = "README.md"
keywords = ["identicon", "icon", "procedural", "vector", "iconvg"]
categories = ["graphics", "visualization"]

[dependencies]
emblem.workspace = true
